[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-ac-guardian"
version = "1.0.0"
description = "Continuously ensures Wi-Fi is negotiated using Wi-Fi 5 (802.11ac) or higher, automatically reconnecting on downgrade."
readme = "README.md"
authors = [{ name = "Antigravity Engineering", email = "engineering@antigravity.ai" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pystray>=0.19.5",
    "Pillow>=10.0.0"
]

[project.scripts]
wifi-ac-guardian = "wifi_ac_guardian.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wifi_ac_guardian*"]
