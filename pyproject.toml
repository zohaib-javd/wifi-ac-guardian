[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-ac-guardian-win"
version = "1.5.9"
description = "WiFi AC Guardian for Windows 11"
authors = [{ name = "Zohaib Javed (Zeejay)" }]
requires-python = ">=3.8"
dependencies = [
    "pystray>=0.19.0",
    "Pillow>=9.0.0",
]

[project.scripts]
wifi-ac-guardian-win = "wifi_ac_guardian_win.cli:main"

[project.gui-scripts]
wifi-ac-guardian-win-gui = "wifi_ac_guardian_win.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy-v0.1", "node_modules", ".git", "build_backend", "wifi-guardian-ui", ".cache"]
python_files = ["test_*.py"]
